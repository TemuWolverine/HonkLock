name: Publish Pages

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - 'static/**'
      - '.github/workflows/publish-pages.yml'
  workflow_run:
    workflows:
      - Publish Firmware
    types:
      - completed
  pull_request:
    paths:
      - 'static/**'
      - '.github/workflows/publish-pages.yml'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup ImageMagick
        uses: mfinelli/setup-imagemagick@v8.0.0

      - name: Install libvips
        run: |
          cd ./static
          sudo apt-get update
          sudo apt-get install -y libvips libvips-dev libvips-tools

      - name: Setup Ruby
        # https://github.com/ruby/setup-ruby/releases/tag/v1.207.0
        uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          ruby-version: '3.1' # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
          working-directory: ./static

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        working-directory: ./static
        run: bundle exec jekyll build -s . -d ../../output
        env:
          JEKYLL_ENV: production

      - name: Check build output
        run: |
          echo "=== Checking output directory ==="
          ls -lah output/ || echo "output/ does not exist"
          echo "=== Checking static/_site ==="
          ls -lah static/_site/ 2>/dev/null || echo "static/_site/ does not exist"
          echo "=== Looking for CSS files ==="
          find . -name "tailwind.css" -type f

      - name: Fetch firmware files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --pattern '*' --dir output/firmware
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output
          retention-days: 1

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
