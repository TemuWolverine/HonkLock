substitutions:
  clkpin: GPIO04
  mosi: GPIO06
  miso: GPIO05
  cs_pin: GPIO7
  gdo0_pin: GPIO3
  gdo1_pin: GPIO2
  led_pin: GPIO8

esphome:
  name: honklockgateway
  friendly_name: HonklockGateway
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  variant: esp32c3
  framework:
    type: esp-idf

# Modular packages: Include either or both depending on the devices in your system
packages:
  ivac: !include gateway_ivac.yaml
  arlec_rc210: !include gateway_arlec_rc210.yaml

# Allow Over-The-Air updates
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  manual_ip:
    static_ip: 10.0.1.139
    gateway: 10.0.0.1
    subnet: 255.0.0.0

logger:
  level: DEBUG

# SPI configuration for the CC1101 transceiver
spi:
  clk_pin: ${clkpin}
  mosi_pin: ${mosi}
  miso_pin: ${miso}
  interface: software

# Configure the CC1101 transceiver hardware registers
cc1101:
  id: my_cc1101
  cs_pin: ${cs_pin}
  filter_bandwidth: 325kHz
  frequency: 433.92MHz
  manchester: true

# Configures the RF Transmitter output pin (using CC1101 GDO0)
remote_transmitter:
  id: rf_tx
  pin: ${gdo0_pin}
  carrier_duty_percent: 100%
  non_blocking: true
  on_transmit:
    - lambda: |-
        ESP_LOGI("rf_tx", "CC1101 entering TX mode and transmitting pulses...");
    - cc1101.begin_tx: my_cc1101
  on_complete:
    - lambda: |-
        ESP_LOGI("rf_tx", "Transmission finished, CC1101 returning to IDLE mode.");
    - cc1101.set_idle: my_cc1101

# Configures the RF Receiver listening pin (using CC1101 GDO2) for on-demand learning
remote_receiver:
  id: rf_rx
  pin: ${gdo1_pin}
  dump: []
  filter: 50us
  idle: 20ms
  buffer_size: 2kb

# ESP32-C3-SuperMini Onboard LED (GPIO8, active-low)
output:
  - platform: gpio
    pin:
      number: ${led_pin}
      inverted: true
    id: onboard_led_out

light:
  - platform: binary
    name: "Onboard LED"
    id: onboard_led
    output: onboard_led_out
    internal: true
    effects:
      - strobe:
          name: "Blink"
          colors:
            - state: true
              duration: 250ms
            - state: false
              duration: 250ms